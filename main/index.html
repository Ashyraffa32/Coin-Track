<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Coin Track</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply theme immediately to prevent flashing
        (function() {
            const settings = JSON.parse(localStorage.getItem('settings')) || {};
            if (settings.theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div>
            <a href="settings.html">Settings</a>
        </div>
        <!-- Quick Calculator Section -->
        <div id="quick-calculator-section" class="section">
            <h1 data-i18n="quickCalculatorTitle">Quick Calculator</h1>
            <div class="calculator">
                <input type="text" id="calc-display" readonly>
                <div class="calc-buttons">
                    <!-- Calculator buttons -->
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operator">/</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">*</button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operator">-</button>
                    <button>0</button>
                    <button>.</button>
                    <button class="operator">+</button>
                    <button class="operator">=</button>
                    <button class="operator">C</button>
                </div>
            </div>
        </div>

        <!-- Transactions Section -->
        <div id="transactions-section" class="section hidden">
            <h1 data-i18n="transactionsTitle">Transactions</h1>
            <div class="summary-container">
                <div class="summary-box pemasukan">
                    <h2 data-i18n="totalIncomeLabel">Income</h2>
                    <p id="total-pemasukan">$0</p>
                </div>
                <div class="summary-box pengeluaran">
                    <h2 data-i18n="totalExpenseLabel">Expense</h2>
                    <p id="total-pengeluaran">$0</p>
                </div>
                <div class="summary-box saldo">
                    <h2 data-i18n="balanceLabel">Balance</h2>
                    <p id="saldo-akhir">$0</p>
                </div>
            </div>

            <div class="main-content">
                <div class="form-section">
                    <h2 data-i18n="addTransactionLabel">Add Transaction</h2>
                    <form id="form-transaksi">
                        <input type="text" id="deskripsi" data-i18n-placeholder="descriptionPlaceholder" placeholder="Description" required>
                        <input list="kategori-list" id="kategori" data-i18n-placeholder="categoryPlaceholder" placeholder="Category" required>
                        <datalist id="kategori-list">
                            <option value="Add Your Own"></option>
                        </datalist>
                        <input type="number" id="kuantitas" data-i18n-placeholder="quantityPlaceholder" placeholder="Quantity" min="1" value="1" required>
                        <input type="number" id="jumlah" data-i18n-placeholder="pricePlaceholder" placeholder="Price" required>
                        <select id="tipe" required>
                            <option value="pemasukan" data-i18n="incomeOption">Income</option>
                            <option value="pengeluaran" data-i18n="expenseOption">Expense</option>
                        </select>
                        <input type="date" id="tanggal" required>
                        <button type="submit" data-i18n="addButton">Add</button>
                    </form>
                </div>

                <div class="history-section">
                    <h2 data-i18n="historyLabel">Transaction History</h2>
                    <div class="history-filters">
                        <input type="text" id="search-transactions" data-i18n-placeholder="searchTransactionsPlaceholder" placeholder="Search description or category">
                        <input list="category-options" id="filter-category" data-i18n-placeholder="filterCategoryPlaceholder" placeholder="Filter by category">
                        <datalist id="category-options">
                            <option value="Add Your Own"></option>
                        </datalist>
                        <input type="number" id="filter-amount" data-i18n-placeholder="filterAmountPlaceholder" placeholder="Max amount" min="0">
                        <button type="button" id="clear-filters-btn" data-i18n="clearFiltersButton">Clear</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th data-i18n="dateHeader">Date</th>
                                    <th data-i18n="descriptionHeader">Description</th>
                                    <th data-i18n="categoryHeader">Category</th>
                                    <th data-i18n="amountHeader">Amount</th>
                                    <th data-i18n="quantityHeader">Quantity</th>
                                    <th data-i18n="typeHeader">Type</th>
                                    <th data-i18n="actionHeader">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-transaksi">
                                <!-- Transactions will be dynamically added here -->
                            </tbody>
                        </table>
                    </div>
                    <br>
                    <br>
                    <br>
                </div>

                
            </div>
        </div>
    </div>

       <!-- Notes Section -->
 <div id="notes-section" class="section hidden">
    <div class="notes-wrapper">
        <textarea id="notes-textarea" data-i18n-placeholder="notesPlaceholder"></textarea>
        
        <div class="notes-controls">
            <button id="save-local-btn" class="btn-primary" data-i18n="saveLocalBtn">
                Save to App
            </button>
            <div class="download-group">
            </div>
        </div>
    </div>
</div>

 

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button id="nav-calculator" class="active" data-i18n="quickCalculatorNav">Quick Calculator</button>
        <button id="nav-transactions" data-i18n="transactionsNav">Transactions</button>
        <button id="nav-notes" data-i18n="notesNav">Notes</button>
    </nav>

    <script src="lang.js"></script>
    <script src="app-settings.js"></script>
    <script src="script.js"></script>
</body>
</html>
